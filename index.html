<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathUNO - Media Pembelajaran Matematika</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎴</div>
        <h1>MathUNO</h1>
        <p>Belajar Matematika Seru!</p>
        <p style="font-size: 14px; margin-top: 20px;">
            ✅ Proyek berhasil dibuat!
        </p>
        <button class="btn" onclick="alert('Selamat! MathUNO berjalan! 🎉')">
            Klik Saya
        </button>
    </div>
</body>
</html>
